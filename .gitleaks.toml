# gitleaks configuration.
#
# The default rules are kept. The allowlist records the findings that were
# reviewed by hand and confirmed not to be credentials, so a new finding in any
# other file still fails the scan.
#
# Reviewed on 2026-10-21 with gitleaks 8.30.1 over the whole history:
#
#   internal/sipgw/auth_test.go and internal/sipgw/config_test.go
#       the fixed nonce-signing secret the tests use, so a digest can be
#       recomputed deterministically. It authenticates nothing: the gateway's
#       real secret is read from SIPGW_NONCE_SECRET at startup and must be at
#       least 16 random bytes.
#
# A credential anywhere else, including in a test file, is a finding.

title = "WiFi Secure Call Server"

[extend]
useDefault = true

[allowlist]
description = "The fixed nonce secret used by the sipgw tests"
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]
